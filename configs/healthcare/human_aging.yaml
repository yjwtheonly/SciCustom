requirement: human_aging
domain: human aging
description: >
  Generate questions that probe understanding of biological mechanisms of
  human aging.  The questions should focus on molecular, cellular, and
  systemic processes associated with aging, such as genomic stability,
  cellular senescence, metabolic regulation, and tissue-level decline.
  Emphasize mechanistic reasoning rather than epidemiological statistics.

k1: 10
k2: 100
fuzzy_threshold: 85.0
proxy_samples: 100
encoder_name: roberta-base

voting_judges:
  - {provider: openai, model: gpt-5}
  - {provider: anthropic, model: claude-opus-4-5}
  - {provider: google, model: gemini-3-pro-preview}

relevance_judges:
  - {provider: openai, model: gpt-5}
  - {provider: anthropic, model: claude-opus-4-5}
  - {provider: google, model: gemini-3-pro-preview}

mcq_writer:
  provider: openai
  model: gpt-5
