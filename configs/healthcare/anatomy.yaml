requirement: anatomy
domain: anatomy
description: >
  Generate questions that evaluate knowledge of human anatomy.  The questions
  should focus on the identification, spatial relationships, and functional
  roles of anatomical structures.  Avoid surgical procedures or pathological
  conditions.

k1: 10
k2: 100
fuzzy_threshold: 85.0
proxy_samples: 100
encoder_name: roberta-base

voting_judges:
  - {provider: openai, model: gpt-5}
  - {provider: anthropic, model: claude-opus-4-5}
  - {provider: google, model: gemini-3-pro-preview}

relevance_judges:
  - {provider: openai, model: gpt-5}
  - {provider: anthropic, model: claude-opus-4-5}
  - {provider: google, model: gemini-3-pro-preview}

mcq_writer:
  provider: openai
  model: gpt-5
